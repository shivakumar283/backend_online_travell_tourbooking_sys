# Application Configuration
spring.application.name=travel-tour-backend
server.port=8080

# PostgreSQL / Aiven Database
# Replace with your Aiven connection string
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/traveltour}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:MyTravelTourSuperSecretKeyThatShouldBeAtLeast256BitsLong!}
app.jwt.expiration-ms=86400000

# CORS (update for production)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging
logging.level.com.traveltour=INFO
logging.level.org.springframework.security=WARN
